<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>導覽網站</title>
<style>
:root{--ink:#25313b;--muted:#6f7c87;--faint:#a3adb5;--line:rgba(37,49,59,.09);--glass:rgba(255,255,255,.86);--accent:#c8643b;--pw:340px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:400 14.5px/1.85 "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#c9e2ea 0%,#e3eee9 48%,#efece3 100%)}
.serif{font-family:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif}
.tn{font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0}#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{pointer-events:auto;cursor:pointer;font-size:12px;line-height:1;padding:6px 9px;border-radius:7px;background:rgba(255,255,255,.78);color:var(--ink);white-space:nowrap;transition:all .35s;transform:translateY(-6px)}
.lb i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:0}
.lb.off{background:transparent;color:var(--faint)}.lb.off i{opacity:.4}
.lb.on{background:var(--ink);color:#fff}
.lb.catlb{display:none;font-weight:600;font-size:13px}body:not([data-mode="tour"]):not([data-mode="island"]) .lb.catlb{display:block}body:not([data-mode="tour"]):not([data-mode="island"]) .lb[data-crowd]{display:none}
.lb.dy{pointer-events:none;background:transparent;color:var(--faint);font-size:11px;transform:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 14px 36px rgba(31,45,61,.14)}
#tl{position:fixed;left:20px;top:16px;max-width:min(520px,calc(100vw - var(--pw) - 60px));z-index:5}
#tl h1{margin:0;font-size:20px;line-height:1.3;letter-spacing:.05em;font-weight:900}
#tl p{margin:2px 0 8px;color:var(--muted);font-size:12.5px;line-height:1.6}
#chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:0;font:inherit;font-size:12px;line-height:1;padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.78);color:var(--ink);cursor:pointer}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.chip.cur{background:var(--ink);color:#fff}.chip.ghost{background:transparent;color:var(--muted)}
#intro{position:fixed;left:20px;bottom:7vh;width:min(460px,calc(100vw - 40px));padding:26px 26px 22px;z-index:5;transition:opacity .5s}
#intro h2{margin:0 0 8px;font-size:26px;line-height:1.35;letter-spacing:.05em;font-weight:900}
#intro p{margin:0 0 16px;color:var(--muted)}
.btn{border:0;font:inherit;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;margin-right:8px}
.btn.sec{background:rgba(37,49,59,.08);color:var(--ink)}
#panel{position:fixed;right:16px;top:16px;bottom:16px;width:var(--pw);z-index:6;display:flex;flex-direction:column;transition:opacity .4s,transform .4s}
#panel.hide{opacity:0;pointer-events:none;transform:translateX(20px)}
.ps{padding:16px 18px;border-bottom:1px solid var(--line)}.ps:last-child{border:0}
.sm{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint);margin-bottom:6px}
#stats{display:flex;flex-direction:column;gap:10px;min-height:20px}
.stat{opacity:0;transform:translateY(6px);transition:all .5s}.stat.show{opacity:1;transform:none}
.stat b{font-size:28px;line-height:1.1;font-weight:700}.stat u{text-decoration:none;font-size:13px;color:var(--muted);margin-left:4px}
.stat span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
#desc{flex:1;overflow:auto;padding:16px 18px;border-bottom:1px solid var(--line)}
#desc .body{opacity:0;transition:opacity .7s}#desc .body.show{opacity:1}
#desc h3{margin:2px 0 6px;font-size:17px;line-height:1.4;font-weight:900;letter-spacing:.04em}
#desc img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#e7ebe7}
#ctl{padding:14px 18px}
#ctl .row{display:flex;align-items:center;gap:8px}
.ib{border:0;width:34px;height:34px;border-radius:10px;background:rgba(37,49,59,.08);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ib.pri{background:var(--ink);color:#fff}.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
#dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--faint);opacity:.45;cursor:pointer}
#dots button.cur{opacity:1;background:var(--accent);transform:scale(1.35)}
#spd{font-size:12px;width:auto;padding:0 10px}
#ann{position:fixed;left:0;right:calc(var(--pw) + 32px);top:15%;z-index:4;text-align:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:all .6s}
#ann.show{opacity:1;transform:none}
#ann .box{display:inline-block;max-width:min(560px,90%);padding:18px 30px 16px;border-radius:18px;background:var(--glass);box-shadow:0 14px 36px rgba(31,45,61,.14);backdrop-filter:blur(14px)}
#ann .cat{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
#ann h2{margin:2px 0 2px;font-size:30px;line-height:1.3;letter-spacing:.06em;font-weight:900}
#ann p{margin:0;color:var(--muted)}
#cs{position:fixed;left:0;right:calc(var(--pw) + 32px);bottom:6vh;z-index:4;display:flex;justify-content:center;pointer-events:none;perspective:900px}
#cs .card{width:min(380px,88%);min-height:130px;position:relative;transform-style:preserve-3d;transition:transform .9s,opacity .5s;opacity:0}
#cs .card.show{opacity:1}#cs .card.flip{transform:rotateY(180deg)}
#cs .f,#cs .b{position:absolute;inset:0;border-radius:16px;padding:16px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 36px rgba(31,45,61,.14)}
#cs .f{background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.12em}
#cs .b{background:var(--glass);transform:rotateY(180deg);backdrop-filter:blur(14px)}
#cs .b small{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint)}#cs .b p{margin:2px 0 0;font-size:14px;line-height:1.75}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(37,49,59,.28);backdrop-filter:blur(3px)}.ov.on{display:grid}
#card{width:min(520px,calc(100vw - 28px));max-height:86vh;overflow:auto;padding:24px 26px}
#card .x,#end .x{float:right;border:0;background:rgba(37,49,59,.08);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--ink)}
#card h2{margin:0 0 10px;font-size:24px;line-height:1.35;font-weight:900;letter-spacing:.04em}
.hl{border-left:3px solid var(--accent);padding-left:12px;margin:0 0 14px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.sub{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint);margin:14px 0 2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags a,.tags span{font-size:12px;padding:4px 10px;border-radius:7px;background:rgba(37,49,59,.07);color:var(--ink);text-decoration:none;line-height:1.6}
.src{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px}
#end .in{width:min(640px,calc(100vw - 28px));max-height:88vh;overflow:auto;padding:30px 30px 26px}
#end h2{margin:0 0 10px;font-size:26px;font-weight:900;letter-spacing:.05em}
#end .grp{margin:12px 0}
body.instant *{transition:none!important}
@media(max-width:760px){
 :root{--pw:0px}
 #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;border-radius:18px 18px 0 0}
 #panel.hide{transform:translateY(20px)}
 #stats{flex-direction:row;gap:14px}.stat b{font-size:22px}
 #desc img{width:84px;float:right;margin:0 0 6px 10px;aspect-ratio:1}
 #ann{right:0;top:84px}#ann h2{font-size:22px}#ann .box{padding:10px 18px}
 #cs{right:0;bottom:calc(46vh + 8px)}#cs .card{min-height:96px}#cs .b p{font-size:13px;line-height:1.6}#cs .b{padding:12px 16px}
 #tl{max-width:calc(100vw - 32px);left:16px;right:16px}#tl h1{font-size:17px}#tl p{display:none}
 #chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chip{white-space:nowrap;flex:none}
 #intro{left:12px;right:12px;width:auto;bottom:12px;padding:18px}#intro h2{font-size:21px}
}
</style></head><body>
<div id="sky"><i class="d"></i><i class="n"></i></div><div id="stage"></div><div id="labels"></div>
<div id="tl"><div id="tg"><button class="tgb" id="themeb"></button><button class="tgb" id="sndb"></button></div><h1 class="serif" id="ttl"></h1><p id="sub"></p><div id="chips"></div></div>
<div id="intro" class="glass"><h2 class="serif" id="tag"></h2><p id="lead"></p><button class="btn" id="go">開始導覽</button><button class="btn sec" id="free">自由探索</button></div>
<div id="ann"><div class="box"><div class="cat" id="a-cat"></div><h2 class="serif" id="a-h"></h2><p id="a-p"></p></div></div>
<div id="cs"><div class="card" id="case"><div class="f">真實情境</div><div class="b"><small id="c-t"></small><p id="c-p"></p></div></div></div>
<div id="panel" class="glass hide">
 <div class="ps" id="statsps"><div class="sm">摘要數據</div><div id="stats"></div></div>
 <div id="desc"><div class="sm" id="d-n"></div><div class="body" id="d-b"></div></div>
 <div id="ctl"><div class="row"><button class="ib" id="prev" aria-label="上一步"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="ib pri" id="play" aria-label="播放"></button><button class="ib" id="next" aria-label="下一步"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><div id="dots"></div><button class="ib" id="spd">1×</button></div></div>
</div>
<div class="ov" id="cardov"><div class="glass" id="card"></div></div>
<div class="ov" id="end"><div class="glass in"><button class="x" id="end-x">×</button><h2 class="serif">這趟導覽的最後</h2><p id="e-t"></p><div id="e-g"></div><p id="e-c" style="color:var(--muted)"></p><button class="btn" id="again">再看一次</button><button class="btn sec" id="home">回到全景</button></div></div>

  const THEMES = {"day": {"seed": 21, "light": {"sky": "#f2f8ff", "ground": "#d9cfb4", "hemi": 1.0, "sun": "#fff4e0", "sunI": 1.25, "sunPos": [14, 24, 10]}, "fog": {"color": "#d6ebf1", "near": 1.6, "far": 5.5}, "sea": {"deep": "#4a94bf", "mid": "#5cb3c6", "shallow": "#a6e2d5", "foam": "#ffffff", "horizon": "#d6ebf1", "glint": "#ffffff", "cloudShadow": 0.16, "glitter": 0.45, "spark": 0.3, "wave": 0.016, "normK": 1.1, "glintElev": 0.5, "shallowWidth": 7, "specPow": 90, "path": 10}, "cloud": {"count": 18, "size": [1.5, 3.0], "h": [6, 12], "spread": 40, "wind": [1, 0.35], "speed": 0.45, "top": "#ffffff", "bottom": "#d7e4f0", "emissive": "#ffffff", "emissiveI": 0.3, "opacity": 0.96, "occluded": 0, "margin": 1.2, "maxAng": 0.3}, "bird": {"flocks": 2, "perFlock": 6, "h": [11, 16], "scale": 1.25, "body": "#ffffff", "tip": "#5d6b78"}, "boats": {"count": 3, "scale": 1.3, "hull": ["#c8643b", "#3f86a8", "#ffffff"], "sail": "#fffaf0"}, "lanterns": null, "fx": {"boost": 1.1, "dust": 1.25}}, "night": {"seed": 33, "light": {"sky": "#ffd6b8", "ground": "#6c6a98", "hemi": 0.95, "sun": "#ffb877", "sunI": 1.45, "sunPos": [18, 12, 10]}, "fog": {"color": "#f1b49c", "near": 1.3, "far": 4.8}, "sea": {"deep": "#3f5283", "mid": "#4f7b97", "shallow": "#8bb8ad", "foam": "#fff1df", "horizon": "#f0b39c", "glint": "#ffc778", "cloudShadow": 0.0, "glitter": 1.0, "spark": 0.4, "wave": 0.018, "normK": 1.5, "glintElev": 0.38, "shallowWidth": 6.5, "specPow": 90, "path": 22}, "cloud": {"count": 16, "size": [1.6, 3.2], "h": [6, 12], "spread": 40, "wind": [1, -0.25], "speed": 0.35, "top": "#ffece6", "bottom": "#cbb4d8", "emissive": "#ffcab6", "emissiveI": 0.35, "opacity": 0.95, "occluded": 0, "margin": 1.2, "maxAng": 0.3}, "bird": {"flocks": 2, "perFlock": 6, "h": [11, 17], "scale": 1.2, "body": "#3a3348", "tip": "#2a2436"}, "boats": null, "lanterns": {"count": 12, "y0": 1.5, "top": 19, "scale": 1.35, "paper": "#ffe3b0", "glow": "#ffa85a", "glowSize": 2.2}, "fx": {"boost": 1.25, "dust": 1.05}}};
  const T = window.__tour;
  if (!T || !T.W || !T.THREE || !T.camera) return;
  const THREE = T.THREE, W = T.W, cam = T.camera, ctl = T.controls;
  const scene = T.scene || W.anchors[Object.keys(W.anchors)[0]].parent;
  if (!scene || !scene.isScene) return;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = matchMedia("(max-width:760px)").matches;
  const R = W.R;
  const APO = 7.4 * 1.16 * Math.cos(Math.PI / 6);
  const isl = (W.isl || []).map((o) => o.c);
  const D = THEMES.day, N = THEMES.night;
  const col = (h) => new THREE.Color(h);
  let seed = 21;
  const rnd = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rr = (a, b) => a + rnd() * (b - a);
  const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  // 把兩個主題的顏色先轉成 Color 物件，切換時直接內插
  const C2 = (path) => { const g = (o) => path.split(".").reduce((x, k) => x[k], o); return [col(g(D)), col(g(N))]; };
  const S2 = (path) => { const g = (o) => path.split(".").reduce((x, k) => x[k], o); return [g(D), g(N)]; };
  const tmpC = new THREE.Color();
  const lc = (pair, t, out) => (out || tmpC).copy(pair[0]).lerp(pair[1], t);
  const ls = (pair, t) => lerp(pair[0], pair[1], t);

  /* ---------- 光線 ---------- */
  const hemi = scene.children.find((o) => o.isHemisphereLight);
  const sun = scene.children.find((o) => o.isDirectionalLight);
  const L = { sky: C2("light.sky"), ground: C2("light.ground"), sun: C2("light.sun"), hemi: S2("light.hemi"), sunI: S2("light.sunI"),
    pos: [new THREE.Vector3(...D.light.sunPos), new THREE.Vector3(...N.light.sunPos)] };

  /* ---------- 霧 ---------- */
  const fog = new THREE.Fog(D.fog.color, 200, 400);
  scene.fog = fog;
  const F = { color: C2("fog.color"), near: S2("fog.near"), far: S2("fog.far") };

  /* ---------- 海面 ---------- */
  const sea = scene.children.find((o) => o.isMesh && o.geometry && o.geometry.type === "CircleGeometry" && o.geometry.parameters.radius > R + 20);
  const MAXI = 32, MAXC = 16;
  const SC = ["deep", "mid", "shallow", "foam", "horizon", "glint"].map((k) => [k, C2("sea." + k)]);
  const SS = ["cloudShadow", "glitter", "spark", "wave", "normK", "glintElev", "shallowWidth", "specPow", "path"].map((k) => [k, S2("sea." + k)]);
  let seaMat = null;
  if (sea) {
    seaMat = new THREE.ShaderMaterial({
      fog: true,
      uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() },
        uFoam: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uGlint: { value: new THREE.Color() },
        uIsl: { value: Array.from({ length: MAXI }, (_, i) => new THREE.Vector2(isl[i] ? isl[i].x : 9999, isl[i] ? isl[i].z : 9999)) },
        uCount: { value: Math.min(MAXI, isl.length) },
        uApo: { value: APO },
        uCl: { value: Array.from({ length: MAXC }, () => new THREE.Vector3(9999, 9999, 0)) },
        uClN: { value: 0 },
        uCloudShadow: { value: 0 }, uSeaR: { value: sea.geometry.parameters.radius },
        uSun: { value: new THREE.Vector3(0, 0.5, -1).normalize() },
        uGlitter: { value: 0 }, uSpark: { value: 0 }, uWave: { value: 0 }, uNormK: { value: 1 },
        uShallowWidth: { value: 7 }, uSpecPow: { value: 80 }, uPath: { value: 8 },
      }]),
      vertexShader: `
        varying vec3 vW;
        #include <fog_pars_vertex>
        void main(){
          vec4 w = modelMatrix * vec4(position, 1.0);
          vW = w.xyz;
          vec4 mvPosition = viewMatrix * w;
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }`,
      fragmentShader: `
        uniform float uTime, uApo, uCloudShadow, uSeaR, uGlitter, uSpark, uWave, uNormK, uShallowWidth, uSpecPow, uPath;
        uniform vec3 uDeep, uMid, uShallow, uFoam, uHorizon, uGlint, uSun;
        uniform vec2 uIsl[${MAXI}]; uniform int uCount;
        uniform vec3 uCl[${MAXC}]; uniform int uClN;
        varying vec3 vW;
        #include <common>
        #include <fog_pars_fragment>
        float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
        float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
        float sdHex(vec2 p, float r){ const vec3 k=vec3(-0.866025404,0.5,0.577350269);
          p=abs(p); p-=2.0*min(dot(k.xy,p),0.0)*k.xy; p-=vec2(clamp(p.x,-k.z*r,k.z*r),r); return length(p)*sign(p.y); }
        float wav(vec2 p, float t){
          return vn(p*0.42+vec2(t*0.05,t*0.03)) + 0.5*vn(p*1.05+vec2(-t*0.08,t*0.05)) + 0.25*vn(p*2.5+vec2(t*0.11,-t*0.09)); }
        void main(){
          vec2 p = vW.xz; float t = uTime;
          float d = 1e4;
          for (int i = 0; i < ${MAXI}; i++){ if (i >= uCount) break; vec2 q = p - uIsl[i]; d = min(d, sdHex(vec2(q.y, q.x), uApo)); }
          float w = wav(p, t);
          float dd = d + (w - 0.85) * 1.8;
          float sh = 1.0 - smoothstep(0.0, uShallowWidth, dd);
          vec3 c = mix(uMid, uDeep, smoothstep(uShallowWidth, uSeaR * 0.55, d));
          c = mix(c, uShallow, sh * sh);
          vec3 V = normalize(cameraPosition - vW);
          float camD = length(cameraPosition - vW);
          float detail = 1.0 - smoothstep(45.0, 150.0, camD);
          c *= 0.97 + 0.06 * vn(p * 0.08 + vec2(t * 0.01, 0.0));
          float band = smoothstep(0.72, 1.0, sin(w * 6.0 + t * 0.5) * 0.5 + 0.5);
          c += band * uWave * (0.35 + 0.65 * (1.0 - sh)) * detail;
          float pathF = pow(max(dot(reflect(-uSun, vec3(0.0, 1.0, 0.0)), V), 0.0), uPath);
          float e = 0.35;
          float hx = wav(p + vec2(e, 0.0), t) - w, hz = wav(p + vec2(0.0, e), t) - w;
          float nk = uNormK * (0.35 + 0.65 * detail);
          vec3 N = normalize(vec3(-hx * nk, 1.0, -hz * nk));
          float spec = pow(max(dot(reflect(-uSun, N), V), 0.0), uSpecPow);
          c += uGlint * spec * uGlitter * (0.25 + 0.75 * pathF);
          c += uGlint * pathF * uGlitter * 0.12;
          float sp = vn(p * 3.1 + vec2(t * 0.7, -t * 0.5)) * vn(p * 2.3 - vec2(t * 0.4, t * 0.6));
          c += uGlint * smoothstep(0.7, 0.9, sp) * uSpark * (1.0 - sh * 0.6) * detail * (0.3 + 0.7 * pathF);
          float fz = d + 0.22 * sin(t * 1.3 + w * 5.0);
          float foam = (1.0 - smoothstep(0.0, 0.85, fz)) * step(-0.4, d);
          float ring = smoothstep(0.32, 0.0, abs(fz - 1.7 - 0.45 * sin(t * 0.8))) * smoothstep(0.45, 0.7, vn(p * 1.7 + t * 0.25));
          c = mix(c, uFoam, clamp(foam * 0.9 + ring * 0.5, 0.0, 1.0));
          float s = 0.0;
          for (int i = 0; i < ${MAXC}; i++){ if (i >= uClN) break; vec3 cl = uCl[i]; float r = length(p - cl.xy); s = max(s, 1.0 - smoothstep(cl.z * 0.25, cl.z, r)); }
          c *= 1.0 - clamp(s, 0.0, 1.0) * uCloudShadow;
          c = mix(c, uHorizon, smoothstep(uSeaR * 0.5, uSeaR * 0.97, length(p)));
          gl_FragColor = vec4(c, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          #include <fog_fragment>
        }`,
    });
    sea.material = seaMat;
  }

  /* ---------- 雲 ---------- */
  const CL = { top: C2("cloud.top"), bottom: C2("cloud.bottom"), emissive: C2("cloud.emissive"), emissiveI: S2("cloud.emissiveI"), opacity: S2("cloud.opacity") };
  const CC = D.cloud;
  const clouds = [], puffs = [];
  const puffGeo = (r) => {
    const g = new THREE.IcosahedronGeometry(r, 1);
    const pos = g.attributes.position, ks = new Float32Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i);
      if (y < -r * 0.22) { y = -r * 0.22 + (y + r * 0.22) * 0.3; pos.setY(i, y); }
      ks[i] = ss(-r * 0.3, r * 0.75, y);
    }
    g.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(pos.count * 3), 3));
    g.computeVertexNormals();
    puffs.push({ g, ks });
    return g;
  };
  const cT = new THREE.Color(), cB = new THREE.Color(), cX = new THREE.Color();
  const recolorClouds = (m) => {
    lc(CL.top, m, cT); lc(CL.bottom, m, cB);
    puffs.forEach(({ g, ks }) => {
      const a = g.attributes.color;
      for (let i = 0; i < ks.length; i++) { cX.copy(cB).lerp(cT, ks[i]); a.setXYZ(i, cX.r, cX.g, cX.b); }
      a.needsUpdate = true;
    });
  };
  const RC = R + CC.spread;
  const wind = new THREE.Vector2(...CC.wind).normalize();
  for (let k = 0; k < Math.round(CC.count * (small ? 0.6 : 1)); k++) {
    const size = rr(CC.size[0], CC.size[1]);
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, transparent: true, opacity: 0 });
    const g = new THREE.Group();
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1) - 0.5;
      const r = size * (1 - Math.abs(f) * 0.85) * rr(0.85, 1.05) + size * 0.22;
      const m = new THREE.Mesh(puffGeo(r), mat);
      m.position.set(f * size * 2.5 + rr(-0.15, 0.15) * size, rr(0, 0.2) * size, rr(-0.35, 0.35) * size);
      m.rotation.y = rnd() * 6.28;
      g.add(m);
    }
    const top = new THREE.Mesh(puffGeo(size * 0.7), mat);
    top.position.set(rr(-0.4, 0.4) * size, size * 0.55, 0);
    g.add(top);
    if (T.mergeGeos) {
      // 效能：把這朵雲的幾團合併成一個網格（每朵雲仍可各自淡出）
      const parts = g.children.slice(), mine = puffs.splice(puffs.length - parts.length, parts.length);
      const merged = T.mergeGeos(THREE, parts.map((p) => (p.updateMatrix(), p.geometry.applyMatrix4(p.matrix))));
      parts.forEach((p) => g.remove(p));
      g.add(new THREE.Mesh(merged, mat));
      const ks = new Float32Array(mine.reduce((a, x) => a + x.ks.length, 0));
      let off = 0;
      mine.forEach((x) => (ks.set(x.ks, off), (off += x.ks.length)));
      puffs.push({ g: merged, ks });
    }
    g.rotation.y = Math.atan2(wind.x, wind.y) + Math.PI / 2 + rr(-0.4, 0.4);
    const a = rnd() * 6.28, rad = rr(R * 0.4, RC * 0.95);
    g.position.set(Math.cos(a) * rad, rr(CC.h[0], CC.h[1]), Math.sin(a) * rad);
    scene.add(g);
    clouds.push({ g, mat, size, spd: rr(0.6, 1.0) * CC.speed, ph: rnd() * 6.28, op: 0, y0: g.position.y });
  }

  /* ---------- 鳥群 ---------- */
  const B = D.bird;
  const BC = { body: C2("bird.body"), tip: C2("bird.tip") };
  const flocks = [];
  const wingCache = {};
  const wingGeo = (s, inner) => wingCache[s + "|" + inner] || (wingCache[s + "|" + inner] = wingGeo0(s, inner));
  const wingGeo0 = (s, inner) => {
    const v = inner
      ? [0, 0, 0.16, 0, 0, -0.1, s * 0.45, 0.02, -0.02, 0, 0, 0.16, s * 0.45, 0.02, -0.02, s * 0.45, 0.02, 0.1]
      : [0, 0, 0.1, 0, 0, -0.02, s * 0.5, -0.03, -0.2, 0, 0, 0.1, s * 0.5, -0.03, -0.2, s * 0.32, -0.02, 0.02];
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
    g.computeVertexNormals();
    return g;
  };
  const mb = new THREE.MeshLambertMaterial({ flatShading: true, side: THREE.DoubleSide });
  const mt = new THREE.MeshLambertMaterial({ flatShading: true, side: THREE.DoubleSide });
  const birdBody = new THREE.ConeGeometry(0.085, 0.6, 5);
  const birdTail = new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute([0, 0, -0.22, -0.11, 0, -0.42, 0.11, 0, -0.42], 3));
  birdTail.computeVertexNormals();
  const makeBird = () => {
    const g = new THREE.Group();
    g.rotation.order = "YXZ";
    const body = new THREE.Mesh(birdBody, mb);
    body.rotation.x = Math.PI / 2;
    g.add(body);
    const tail = new THREE.Mesh(birdTail, mb);
    g.add(tail);
    const wings = [-1, 1].map((s) => {
      const inner = new THREE.Group(), outer = new THREE.Group();
      inner.position.x = s * 0.05;
      inner.add(new THREE.Mesh(wingGeo(s, true), mb));
      outer.position.set(s * 0.45, 0.02, 0.04);
      outer.add(new THREE.Mesh(wingGeo(s, false), mt));
      inner.add(outer);
      g.add(inner);
      return { s, inner, outer };
    });
    g.scale.setScalar(B.scale);
    scene.add(g);
    return { g, wings, ph: rnd() * 6.28, rate: rr(7, 9.5), gl: rnd() * 6.28, off: new THREE.Vector3() };
  };
  for (let f = 0; f < (small ? 1 : B.flocks); f++) {
    const fl = { rad: rr(R * 0.55, R + 14), ex: rr(0.65, 1), h: rr(B.h[0], B.h[1]), w: (f % 2 ? -1 : 1) * rr(0.07, 0.12), a: rnd() * 6.28, birds: [] };
    for (let i = 0; i < B.perFlock; i++) {
      const b = makeBird();
      const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;
      b.off.set(i ? side * row * 1.15 * B.scale : 0, rr(-0.25, 0.25), -row * 1.0 * B.scale);
      fl.birds.push(b);
    }
    flocks.push(fl);
  }

  // 效能：所有飛鳥的身體、尾巴、翅膀各自共用一組 InstancedMesh；顏色跟著日夜換
  const BI = T.mkInstancer ? T.mkInstancer(THREE, scene) : null;
  if (BI) { flocks.forEach((fl) => fl.birds.forEach((b) => b.g.traverse((o) => o.isMesh && BI.add(o, b.g, true)))); BI.finalize(); }

  /* ---------- 帆船（白天）---------- */
  const boats = [], boatMats = [];
  {
    const wc = document.createElement("canvas"); wc.width = 64; wc.height = 256;
    const x = wc.getContext("2d");
    const gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = gr; x.beginPath(); x.moveTo(26, 0); x.lineTo(38, 0); x.lineTo(64, 256); x.lineTo(0, 256); x.closePath(); x.fill();
    const wakeTex = new THREE.CanvasTexture(wc);
    const BT = D.boats;
    const tm = (o) => { const m = new THREE.MeshLambertMaterial(Object.assign({ transparent: true, flatShading: true }, o)); boatMats.push([m, 1]); return m; };
    for (let k = 0; k < BT.count; k++) {
      const g = new THREE.Group();
      const hullG = new THREE.BoxGeometry(0.62, 0.26, 1.7);
      const hp = hullG.attributes.position;
      for (let i = 0; i < hp.count; i++) {
        if (hp.getZ(i) > 0) hp.setX(i, hp.getX(i) * 0.25);
        if (hp.getY(i) < 0) hp.setX(i, hp.getX(i) * 0.7);
      }
      hullG.computeVertexNormals();
      g.add(new THREE.Mesh(hullG, tm({ color: BT.hull[k % BT.hull.length] })));
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.6, 5), tm({ color: 0x8a6a4a }));
      mast.position.set(0, 0.9, 0.15); g.add(mast);
      const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(0, 1.35); sh.lineTo(-0.85, 0); sh.closePath();
      const sail = new THREE.Mesh(new THREE.ShapeGeometry(sh), tm({ color: BT.sail, side: THREE.DoubleSide, flatShading: false }));
      sail.rotation.y = Math.PI / 2; sail.position.set(0, 0.25, 0.12); g.add(sail);
      const wm = new THREE.MeshBasicMaterial({ map: wakeTex, transparent: true, depthWrite: false, opacity: 0.55 });
      boatMats.push([wm, 0.55]);
      const wake = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 3.4), wm);
      wake.rotation.x = -Math.PI / 2; wake.position.set(0, -0.11, -2.4);
      g.add(wake);
      g.scale.setScalar(BT.scale);
      scene.add(g);
      boats.push({ g, r: R + rr(6, 20), a: (k / BT.count) * 6.28 + rr(-0.4, 0.4), w: (k % 2 ? -1 : 1) * rr(0.025, 0.04), ph: rnd() * 6.28 });
    }
  }

  /* ---------- 天燈（夜晚）---------- */
  const lanterns = [];
  const LT = N.lanterns;
  if (isl.length) {
    const gc = document.createElement("canvas"); gc.width = gc.height = 64;
    const x = gc.getContext("2d");
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,230,180,1)"); gr.addColorStop(0.35, "rgba(255,170,90,.55)"); gr.addColorStop(1, "rgba(255,140,60,0)");
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    const glowTex = new THREE.CanvasTexture(gc);
    const spawn = (o, first) => {
      const c = isl[Math.floor(rnd() * isl.length)], a = rnd() * 6.28, r = rr(1, 6);
      o.base.set(c.x + Math.cos(a) * r, 0, c.z + Math.sin(a) * r);
      o.y = first ? rr(LT.y0, LT.top) : LT.y0;
      o.spd = rr(0.28, 0.45); o.ph = rnd() * 6.28;
    };
    for (let k = 0; k < Math.round(LT.count * (small ? 0.6 : 1)); k++) {
      const g = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: LT.paper, emissive: col(LT.glow), emissiveIntensity: 1.1, transparent: true, flatShading: true });
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.42, 6), mat));
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: LT.glow, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
      sp.scale.setScalar(LT.glowSize || 1.7); g.add(sp);
      g.scale.setScalar(LT.scale);
      scene.add(g);
      const o = { g, mat, sp, base: new THREE.Vector3(), y: 0, spd: 0, ph: 0, spawn };
      spawn(o, true);
      lanterns.push(o);
    }
  }

  /* ---------- 主題內插 ---------- */
  const FXB = S2("fx.boost"), FXD = S2("fx.dust");
  let mix = 0, target = 0, cur = "day";
  const apply = (m) => {
    if (hemi) { lc(L.sky, m, hemi.color); lc(L.ground, m, hemi.groundColor); hemi.intensity = ls(L.hemi, m); }
    if (sun) { lc(L.sun, m, sun.color); sun.intensity = ls(L.sunI, m); sun.position.lerpVectors(L.pos[0], L.pos[1], m); }
    lc(F.color, m, fog.color);
    if (seaMat) {
      const u = seaMat.uniforms;
      SC.forEach(([k, p]) => lc(p, m, u["u" + k[0].toUpperCase() + k.slice(1)].value));
      SS.forEach(([k, p]) => { const n = "u" + k[0].toUpperCase() + k.slice(1); if (u[n]) u[n].value = ls(p, m); });
    }
    clouds.forEach((c) => { lc(CL.emissive, m, c.mat.emissive); c.mat.emissiveIntensity = ls(CL.emissiveI, m); });
    recolorClouds(m);
    lc(BC.body, m, mb.color); lc(BC.tip, m, mt.color);
    if (W.fx) {
      W.fx.uBoost.value = ls(FXB, m); W.fx.uDust.value = ls(FXD, m);
    }
  };
  const autoName = () => { const h = new Date().getHours(); return h >= 6 && h < 18 ? "day" : "night"; };
  const btn = document.getElementById("themeb");
  const icon = { day: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    night: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>' };
  const setTheme = (name, instant) => {
    cur = name; target = name === "night" ? 1 : 0;
    if (instant) { mix = target; apply(mix); }
    document.body.classList.toggle("night", name === "night");
    if (btn) { btn.innerHTML = icon[name]; btn.title = name === "night" ? "夜晚（點一下切換成白天）" : "白天（點一下切換成夜晚）"; btn.setAttribute("aria-label", btn.title); }
    window.dispatchEvent(new CustomEvent("tour", { detail: { type: "theme", night: name === "night", instant: !!instant } }));
  };
  let manual = false;
  const q = new URLSearchParams(location.search).get("theme");
  if (q === "day" || q === "night") { manual = true; setTheme(q, true); } else setTheme(autoName(), true);
  setInterval(() => { if (!manual && autoName() !== cur) setTheme(autoName(), false); }, 60000);
  if (btn) btn.onclick = () => { manual = true; setTheme(cur === "day" ? "night" : "day", false); };
  window.__theme = { set: (n) => { manual = true; setTheme(n, false); }, get: () => cur, auto: () => { manual = false; setTheme(autoName(), false); } };

  /* ---------- 每一格畫面更新 ---------- */
  const tmp = new THREE.Vector3(), fwd = new THREE.Vector3();
  let last = performance.now(), time = 0;
  const prevBR = scene.onBeforeRender;
  scene.onBeforeRender = function (...args) {
    prevBR && prevBR.apply(this, args);
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!reduce) time += dt;

    if (mix !== target) {
      mix = target > mix ? Math.min(target, mix + dt / 1.6) : Math.max(target, mix - dt / 1.6);
      apply(ss(0, 1, mix));
    }
    const m = ss(0, 1, mix);
    const sunDir = sun ? sun.position.clone().normalize() : tmp.set(0.4, 0.8, 0.3);
    const offX = sunDir.x / Math.max(0.2, sunDir.y), offZ = sunDir.z / Math.max(0.2, sunDir.y);

    const camDist = cam.position.distanceTo(ctl ? ctl.target : tmp.set(0, 0, 0));
    fog.near = camDist + R * ls(F.near, m); fog.far = camDist + R * ls(F.far, m);

    if (seaMat) {
      const u = seaMat.uniforms;
      u.uTime.value = reduce ? 12 : time;
      cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      u.uSun.value.set(fwd.x, u.uGlintElev ? u.uGlintElev.value : ls(SS[5][1], m), fwd.z).normalize();
    }

    let ci = 0;
    const cop = ls(CL.opacity, m);
    clouds.forEach((c) => {
      const p = c.g.position;
      if (!reduce) {
        p.x += wind.x * c.spd * dt; p.z += wind.y * c.spd * dt;
        p.y = c.y0 + Math.sin(time * 0.3 + c.ph) * 0.25;
        const along = p.x * wind.x + p.z * wind.y, cross = -p.x * wind.y + p.z * wind.x;
        const lim = Math.sqrt(Math.max(1, RC * RC - cross * cross));
        if (along > lim) { const na = -lim; p.x = na * wind.x - cross * wind.y; p.z = na * wind.y + cross * wind.x; c.op = 0; }
      }
      const r = Math.hypot(p.x, p.z);
      const edge = 1 - ss(RC * 0.78, RC, r);
      let tgt = edge;
      const cp = cam.position;
      if (cp.y > p.y + 0.5) {
        const k = cp.y / (cp.y - p.y);
        const hx = cp.x + (p.x - cp.x) * k, hz = cp.z + (p.z - cp.z) * k;
        if (Math.hypot(hx, hz) < R + c.size * CC.margin) tgt = Math.min(tgt, CC.occluded);
      }
      const ang = (c.size * 2.6) / Math.max(0.1, cp.distanceTo(p));
      tgt *= 1 - ss(CC.maxAng * 0.75, CC.maxAng, ang);
      tgt *= ss(camDist * 0.9, camDist * 1.08, cp.distanceTo(p));   // 雲不會擋在鏡頭和目標之間
      c.op += (tgt - c.op) * Math.min(1, dt * (tgt < c.op ? 4.5 : 2));
      c.mat.opacity = c.op * cop;
      c.g.visible = c.op > 0.01;
      if (seaMat && ci < MAXC && edge > 0.05) {
        seaMat.uniforms.uCl.value[ci].set(p.x - offX * p.y, p.z - offZ * p.y, c.size * 2.6 * edge);
        ci++;
      }
    });
    if (seaMat) seaMat.uniforms.uClN.value = ci;

    flocks.forEach((fl) => {
      if (!reduce) fl.a += fl.w * dt;
      const a = fl.a;
      const cx = Math.cos(a) * fl.rad, cz = Math.sin(a) * fl.rad * fl.ex, cy = fl.h + Math.sin(a * 1.7) * 1.0;
      const dx = -Math.sin(a) * fl.rad * fl.w, dz = Math.cos(a) * fl.rad * fl.ex * fl.w;
      const yaw = Math.atan2(dx, dz);
      const c0 = Math.cos(yaw), s0 = Math.sin(yaw);
      fl.birds.forEach((b) => {
        if (!reduce) b.ph += dt * b.rate;
        const o = b.off;
        b.g.position.set(cx + o.x * c0 + o.z * s0, cy + o.y + Math.sin(time * 1.3 + b.gl) * 0.12, cz - o.x * s0 + o.z * c0);
        b.g.rotation.set(Math.sin(time * 0.9 + b.gl) * 0.05, yaw, -Math.sign(fl.w) * 0.22);
        b.g.visible = cam.position.distanceTo(b.g.position) > 8;   // 太靠近鏡頭就先隱藏
        const env = 0.25 + 0.75 * ss(-0.2, 0.6, Math.sin(time * 0.45 + b.gl));
        const fa = Math.sin(b.ph) * 0.75 * env;
        b.wings.forEach((wg) => {
          wg.inner.rotation.z = wg.s * (fa + 0.08);
          wg.outer.rotation.z = wg.s * Math.sin(b.ph - 0.7) * 0.55 * env;
        });
      });
    });

    if (BI) { flocks.forEach((fl) => fl.birds.forEach((b) => b.g.updateMatrixWorld(true))); BI.sync(); }

    const bv = 1 - m;
    boatMats.forEach(([mm, base]) => (mm.opacity = base * bv));
    boats.forEach((bt) => {
      bt.g.visible = bv > 0.01;
      if (!reduce) bt.a += bt.w * dt;
      const x = Math.cos(bt.a) * bt.r, z = Math.sin(bt.a) * bt.r;
      const dx = -Math.sin(bt.a) * bt.w, dz = Math.cos(bt.a) * bt.w;
      bt.g.position.set(x, -0.62 + Math.sin(time * 1.6 + bt.ph) * 0.04, z);
      bt.g.rotation.set(Math.sin(time * 1.3 + bt.ph) * 0.04, Math.atan2(dx, dz), Math.sin(time * 1.1 + bt.ph) * 0.06);
    });

    lanterns.forEach((o) => {
      if (!reduce) { o.y += o.spd * dt; o.ph += dt; }
      if (o.y > LT.top) o.spawn(o, false);
      const f = ss(LT.y0, LT.y0 + 1.2, o.y) * (1 - ss(LT.top - 4, LT.top, o.y)) * m;
      o.g.position.set(o.base.x + Math.sin(o.ph * 0.6) * 0.5, o.y, o.base.z + Math.cos(o.ph * 0.5) * 0.5);
      o.g.rotation.z = Math.sin(o.ph * 0.9) * 0.06;
      const near = cam.position.distanceTo(o.g.position) < 3 ? 0 : 1;
      o.mat.opacity = f * near;
      o.sp.material.opacity = f * near * (0.75 + 0.25 * Math.sin(o.ph * 3.1));
      o.g.visible = f * near > 0.01;
    });
  };
})();
</script>
<script type="module" id="sound">
/* ==== 即時合成音效（Web Audio）：按鈕、光柱、翻卡、故事飛入；全景時淡淡的水聲、風聲、鳥鳴（夜晚換成蟲鳴）==== */
(() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const btn = document.getElementById("sndb");
  if (!AC) { btn && (btn.style.display = "none"); return; }
  let ctx = null, master, sfx, amb, revIn, white, brown;
  let on = false, night = document.body.classList.contains("night"), mode = "overview";
  const icons = {
    on: '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
    off: '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  };
  const paint = () => { if (!btn) return; btn.innerHTML = on ? icons.on : icons.off; btn.title = on ? "音效：開（點一下關閉）" : "音效：關（點一下開啟）"; btn.setAttribute("aria-label", btn.title); btn.classList.toggle("off", !on); };
  paint();

  const noiseBuf = (kind, sec) => {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    return b;
  };
  const impulse = (sec, decay) => {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  };
  const init = () => {
    if (ctx) { ctx.state === "suspended" && ctx.resume(); return; }
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = on ? 0.9 : 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 3.5; sfx.connect(master);
    amb = ctx.createGain(); amb.gain.value = 0; amb.connect(master);
    const rev = ctx.createConvolver(); rev.buffer = impulse(2.6, 2.4);
    revIn = ctx.createGain(); revIn.gain.value = 0.5; revIn.connect(rev); rev.connect(master);
    white = noiseBuf("white", 4); brown = noiseBuf("brown", 6);
    buildAmbience();
    setAmb(true);
  };

  /* ---------- 基本音色 ---------- */
  const out = (node, pan, rv, dest) => {
    const p = ctx.createStereoPanner(); p.pan.value = pan || 0;
    node.connect(p); p.connect(dest || sfx);
    if (rv) { const s = ctx.createGain(); s.gain.value = rv; p.connect(s); s.connect(revIn); }
    return p;
  };
  const envG = (t0, a, v, d) => {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    return g;
  };
  const tone = ({ f = 440, f2, type = "sine", t = 0, a = 0.005, d = 0.2, v = 0.1, pan = 0, rv = 0.2, dest }) => {
    const t0 = ctx.currentTime + t, o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    f2 && o.frequency.exponentialRampToValueAtTime(f2, t0 + a + d * 0.8);
    const g = envG(t0, a, v, d); o.connect(g); out(g, pan, rv, dest);
    o.start(t0); o.stop(t0 + a + d + 0.05);
  };
  const hiss = ({ t = 0, a = 0.01, d = 0.2, v = 0.1, type = "bandpass", f = 1000, f2, q = 1, pan = 0, pan2, rv = 0.1, buf }) => {
    const t0 = ctx.currentTime + t, src = ctx.createBufferSource();
    src.buffer = buf || white;
    const flt = ctx.createBiquadFilter(); flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(f, t0); f2 && flt.frequency.exponentialRampToValueAtTime(f2, t0 + a + d);
    const g = envG(t0, a, v, d); src.connect(flt); flt.connect(g);
    const p = out(g, pan, rv);
    pan2 != null && p.pan.linearRampToValueAtTime(pan2, t0 + a + d);
    src.start(t0, Math.random() * 2); src.stop(t0 + a + d + 0.05);
  };
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12);

  /* ---------- 音效 ---------- */
  const SFX = {
    click: () => { tone({ f: 1300, f2: 900, type: "triangle", a: 0.002, d: 0.07, v: 0.05, rv: 0.05 }); tone({ f: 2600, a: 0.001, d: 0.03, v: 0.015, rv: 0 }); },
    primary: () => { tone({ f: N(84), a: 0.004, d: 0.18, v: 0.06, rv: 0.3 }); tone({ f: N(91), t: 0.09, a: 0.004, d: 0.3, v: 0.06, rv: 0.35 }); },
    island: () => {
      tone({ f: N(57), a: 0.12, d: 0.9, v: 0.045, rv: 0.4 }); tone({ f: N(64), a: 0.12, d: 0.9, v: 0.035, rv: 0.4, pan: 0.2 });
      hiss({ type: "lowpass", f: 300, f2: 1400, a: 0.25, d: 0.5, v: 0.05, rv: 0.2 });
    },
    beam: () => {
      const sc = [84, 86, 88, 91, 93, 96, 98, 100, 103];
      sc.forEach((n, i) => tone({ f: N(n), type: i % 2 ? "sine" : "triangle", t: i * 0.055, a: 0.003, d: 0.55, v: 0.042 - i * 0.003, pan: -0.5 + i * 0.12, rv: 0.55 }));
      for (let i = 0; i < 16; i++) tone({ f: 2800 + Math.random() * 3800, t: 0.25 + Math.random() * 1.5, a: 0.002, d: 0.06 + Math.random() * 0.1, v: 0.012 + Math.random() * 0.016, pan: Math.random() * 1.6 - 0.8, rv: 0.6 });
      hiss({ type: "highpass", f: 1800, f2: 7000, a: 0.45, d: 0.9, v: 0.022, rv: 0.4 });
      tone({ f: N(60), a: 0.3, d: 1.3, v: 0.03, rv: 0.4 }); tone({ f: N(67), a: 0.3, d: 1.3, v: 0.022, rv: 0.4 });
    },
    flip: () => {
      hiss({ f: 900, f2: 3400, q: 0.9, a: 0.004, d: 0.13, v: 0.13, rv: 0.08 });
      hiss({ f: 3000, f2: 1400, q: 1.2, t: 0.1, a: 0.004, d: 0.1, v: 0.06, rv: 0.05 });
      tone({ f: 190, f2: 120, a: 0.003, d: 0.09, v: 0.05, rv: 0 });
    },
    storyExit: () => hiss({ f: 2600, f2: 500, q: 1.3, a: 0.05, d: 0.5, v: 0.13, pan: -0.1, pan2: 0.7, rv: 0.15 }),
    storyLand: () => { tone({ f: 660, f2: 990, a: 0.004, d: 0.12, v: 0.055, pan: 0.5, rv: 0.2 }); tone({ f: 1320, t: 0.06, a: 0.003, d: 0.25, v: 0.025, pan: 0.5, rv: 0.35 }); },
    panel: () => { hiss({ f: 1100, f2: 2300, q: 0.7, a: 0.02, d: 0.2, v: 0.05, pan: 0.5, rv: 0.1 }); tone({ f: N(81), t: 0.05, a: 0.006, d: 0.35, v: 0.022, pan: 0.5, rv: 0.35 }); },
    count: () => tone({ f: 700, f2: 1500, type: "triangle", a: 0.02, d: 0.6, v: 0.018, rv: 0.2 }),
    end: () => [72, 76, 79, 84].forEach((n, i) => tone({ f: N(n), t: i * 0.12, a: 0.01, d: 1.3, v: 0.04, rv: 0.5 })),
    day: () => [79, 83, 86, 91].forEach((n, i) => tone({ f: N(n), t: i * 0.07, a: 0.004, d: 0.5, v: 0.04, rv: 0.4 })),
    night: () => [88, 84, 79, 76].forEach((n, i) => tone({ f: N(n), t: i * 0.11, a: 0.01, d: 0.9, v: 0.035, rv: 0.7 })),
  };
  const play = (k) => { if (!ctx || !on || ctx.state !== "running") return; try { SFX[k] && SFX[k](); } catch (e) {} };

  /* ---------- 環境音 ---------- */
  let layers = {};
  const lfo = (freq, depth, param, base) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(param); param.value = base; o.start();
  };
  const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 3); return s; };
  const buildAmbience = () => {
    // 水聲：低頻噪音＋慢速浪潮起伏
    const w = loop(brown), wl = ctx.createBiquadFilter(); wl.type = "lowpass"; wl.frequency.value = 480;
    const wg = ctx.createGain(); lfo(0.085, 0.28, wg.gain, 0.55);
    const wv = ctx.createGain(); wv.gain.value = 0;
    w.connect(wl); wl.connect(wg); wg.connect(wv); wv.connect(amb);
    // 浪花細沙聲
    const s = loop(white), sb = ctx.createBiquadFilter(); sb.type = "bandpass"; sb.frequency.value = 1300; sb.Q.value = 0.6;
    const sg = ctx.createGain(); lfo(0.07, 0.025, sg.gain, 0.03);
    s.connect(sb); sb.connect(sg); sg.connect(wv);
    // 風聲：帶通噪音，頻率與音量緩慢飄移
    const f = loop(white), fb = ctx.createBiquadFilter(); fb.type = "bandpass"; fb.Q.value = 0.8;
    lfo(0.045, 260, fb.frequency, 560);
    const fg = ctx.createGain(); lfo(0.031, 0.05, fg.gain, 0.07);
    const fv = ctx.createGain(); fv.gain.value = 0;
    f.connect(fb); fb.connect(fg); fg.connect(fv); fv.connect(amb);
    layers = { water: wv, wind: fv };
    birdLoop(); cricketLoop();
  };
  const ambTarget = () => (!on ? 0 : mode === "overview" ? 0.2 : mode === "island" ? 0.1 : 0);
  const setAmb = (instant) => {
    if (!ctx) return;
    const t = ctx.currentTime, k = ambTarget();
    amb.gain.cancelScheduledValues(t); amb.gain.setValueAtTime(amb.gain.value, t);
    amb.gain.linearRampToValueAtTime(k, t + (instant ? 0.05 : k > amb.gain.value ? 2.5 : 1.2));
    const wv = layers.water, fv = layers.wind;
    if (wv) { wv.gain.setTargetAtTime(night ? 0.8 : 1, t, 0.8); fv.gain.setTargetAtTime(night ? 0.75 : 0.5, t, 0.8); }
  };
  const ambActive = () => ctx && on && ctx.state === "running" && ambTarget() > 0 && !document.hidden;
  const chirp = (t0, pan) => {
    const n = 2 + Math.floor(Math.random() * 4), base = 2500 + Math.random() * 1700;
    for (let i = 0; i < n; i++) {
      const tt = t0 + i * (0.09 + Math.random() * 0.06), o = ctx.createOscillator(), up = Math.random() < 0.5;
      o.frequency.setValueAtTime(base * (up ? 0.85 : 1.15), tt);
      o.frequency.exponentialRampToValueAtTime(base * (up ? 1.25 : 0.8), tt + 0.06);
      const g = envG(tt, 0.008, 0.022 + Math.random() * 0.012, 0.07);
      o.connect(g); out(g, pan, 0.25, amb); o.start(tt); o.stop(tt + 0.1);
    }
  };
  const gull = (t0, pan) => {
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter();
    o.type = "sawtooth"; lp.type = "lowpass"; lp.frequency.value = 1800;
    o.frequency.setValueAtTime(1150, t0); o.frequency.exponentialRampToValueAtTime(720, t0 + 0.35);
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 28; vg.gain.value = 30; vib.connect(vg); vg.connect(o.frequency);
    const g = envG(t0, 0.03, 0.012, 0.38);
    o.connect(lp); lp.connect(g); out(g, pan, 0.4, amb);
    o.start(t0); vib.start(t0); o.stop(t0 + 0.45); vib.stop(t0 + 0.45);
  };
  const birdLoop = () => {
    if (ambActive() && !night) {
      const t0 = ctx.currentTime + 0.05, pan = Math.random() * 1.4 - 0.7;
      Math.random() < 0.18 ? (gull(t0, pan), Math.random() < 0.5 && gull(t0 + 0.5, pan)) : (chirp(t0, pan), Math.random() < 0.4 && chirp(t0 + 0.5 + Math.random() * 0.4, pan + 0.2));
    }
    setTimeout(birdLoop, 2500 + Math.random() * 5000);
  };
  const cricketLoop = () => {
    if (ambActive() && night) {
      const t0 = ctx.currentTime + 0.05, f = 4300 + Math.random() * 500, pan = Math.random() * 1.6 - 0.8, n = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        const tt = t0 + i * 0.05, o = ctx.createOscillator(); o.frequency.value = f;
        const g = envG(tt, 0.004, 0.008 + Math.random() * 0.005, 0.022);
        o.connect(g); out(g, pan, 0.15, amb); o.start(tt); o.stop(tt + 0.04);
      }
    }
    setTimeout(cricketLoop, 700 + Math.random() * 900);
  };

  /* ---------- 事件串接 ---------- */
  const unlock = () => { init(); };
  addEventListener("pointerdown", unlock, true);
  addEventListener("keydown", unlock, true);
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest && e.target.closest("button, .lb, a");
    if (!el || el === btn) return;
    setTimeout(() => play(el.matches("#go, #again, #isl-go") ? "primary" : "click"), 0);
  });
  addEventListener("tour", (e) => {
    const d = e.detail || {};
    if (d.type === "mode") { mode = d.mode; setAmb(); }
    else if (d.type === "theme") { night = d.night; setAmb(); d.instant || play(night ? "night" : "day"); }
    else if (d.type === "pick") play("click");
    else play(d.type);
  });
  document.addEventListener("visibilitychange", () => { if (!ctx) return; document.hidden ? ctx.suspend() : ctx.resume(); });
  if (btn) btn.onclick = () => {
    init(); on = !on; paint();
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(on ? 0.9 : 0, t + 0.3);
    setAmb(); on && setTimeout(() => play("click"), 30);
  };
  window.__sfx = { play, get on() { return on; }, get ctx() { return ctx; } };
})();
</script>
</body></html>
